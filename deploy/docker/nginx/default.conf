# Spec: 01（审批台静态资源）、10 §3.4（LCP）、07 §8（安全响应头）
# nginx-unprivileged：以 UID 101 运行、监听 8080；只读根文件系统时 /tmp 需为 tmpfs（pid 与临时文件在 /tmp）。
# /api/ 反向代理到 belegt-api（构建时 VITE_API_BASE=/api），避免浏览器跨域；上游地址由环境变量注入（envsubst 模板）。
server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;
    server_tokens off;

    # 安全响应头（审批台不嵌入第三方资源，不加载外部脚本）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location /api/ {
        proxy_pass         ${BELEGT_API_UPSTREAM}/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;          # 审计包导出（10 §5.6 P95 ≤ 120 s）
        client_max_body_size 50m;         # 单文件上限 50 MB（10 §3.3）
    }

    # 带哈希的构建产物长缓存；index.html 不缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }
}
