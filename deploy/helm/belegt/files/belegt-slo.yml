# Spec: 10 §5.3（SLO-01…08、ALR-01…12，Google SRE 多窗口多燃烧率）、§7.3（错误预算政策）
# 同一份规则也被 Helm chart 渲染为 PrometheusRule（deploy/helm/belegt/files/belegt-slo.yml 为本文件的副本）。
# 每条告警的 runbook_url 指向 deploy/ops/alerts-runbook.md 的对应小节（10 §5.3：无运行手册的告警不得上线）。
#
# 指标来源：
#   belegt_http_request_duration_seconds   —— belegt-api（deploy/docker/entry/belegt_asgi.py），SLO-01/02/06 的 SLI
#   belegt_* 业务指标（10 §5.1 表）        —— 由 belegt-core 埋点导出；未埋点前相应告警不会触发（absent 不告警）
#   task_schedule_to_start_latency_*       —— Temporal Server（:9090）
#   pg_*                                   —— postgres-exporter
#   belegt_backup_* / belegt_audit_chain_* —— deploy/ops/backup.sh 与审计链校验作业推送到 Pushgateway（可选）
# 标签约定：禁止 org_id（10 §5.1），只用 org_tier。

groups:
  # ------------------------------------------------------------------ SLI 记录规则
  - name: belegt-slo-recording
    interval: 30s
    rules:
      # SLO-01：API 请求成功（非 5xx 且 < 2 s）。error_ratio = 1 - good/total
      - record: belegt:slo01_error_ratio:rate5m
        expr: 1 - (sum(rate(belegt_http_request_duration_seconds_bucket{le="2.0",status_class!="5xx"}[5m])) / clamp_min(sum(rate(belegt_http_request_duration_seconds_count[5m])), 1e-9))
      - record: belegt:slo01_error_ratio:rate30m
        expr: 1 - (sum(rate(belegt_http_request_duration_seconds_bucket{le="2.0",status_class!="5xx"}[30m])) / clamp_min(sum(rate(belegt_http_request_duration_seconds_count[30m])), 1e-9))
      - record: belegt:slo01_error_ratio:rate1h
        expr: 1 - (sum(rate(belegt_http_request_duration_seconds_bucket{le="2.0",status_class!="5xx"}[1h])) / clamp_min(sum(rate(belegt_http_request_duration_seconds_count[1h])), 1e-9))
      - record: belegt:slo01_error_ratio:rate6h
        expr: 1 - (sum(rate(belegt_http_request_duration_seconds_bucket{le="2.0",status_class!="5xx"}[6h])) / clamp_min(sum(rate(belegt_http_request_duration_seconds_count[6h])), 1e-9))
      - record: belegt:slo01_error_ratio:rate3d
        expr: 1 - (sum(rate(belegt_http_request_duration_seconds_bucket{le="2.0",status_class!="5xx"}[3d])) / clamp_min(sum(rate(belegt_http_request_duration_seconds_count[3d])), 1e-9))
      # SLO-02：读 API 延迟 ≤ 300 ms 比例（目标 99%）
      - record: belegt:slo02_good_ratio:rate30d
        expr: sum(rate(belegt_http_request_duration_seconds_bucket{method="GET",le="0.3"}[30d])) / clamp_min(sum(rate(belegt_http_request_duration_seconds_count{method="GET"}[30d])), 1e-9)
      # SLO-06：证据图写入成功（非 5xx）
      - record: belegt:slo06_error_ratio:rate5m
        expr: sum(rate(belegt_http_request_duration_seconds_count{method="POST",route=~"/graph/objects.*",status_class="5xx"}[5m])) / clamp_min(sum(rate(belegt_http_request_duration_seconds_count{method="POST",route=~"/graph/objects.*"}[5m])), 1e-9)
      - record: belegt:slo06_error_ratio:rate30m
        expr: sum(rate(belegt_http_request_duration_seconds_count{method="POST",route=~"/graph/objects.*",status_class="5xx"}[30m])) / clamp_min(sum(rate(belegt_http_request_duration_seconds_count{method="POST",route=~"/graph/objects.*"}[30m])), 1e-9)
      - record: belegt:slo06_error_ratio:rate1h
        expr: sum(rate(belegt_http_request_duration_seconds_count{method="POST",route=~"/graph/objects.*",status_class="5xx"}[1h])) / clamp_min(sum(rate(belegt_http_request_duration_seconds_count{method="POST",route=~"/graph/objects.*"}[1h])), 1e-9)
      - record: belegt:slo06_error_ratio:rate6h
        expr: sum(rate(belegt_http_request_duration_seconds_count{method="POST",route=~"/graph/objects.*",status_class="5xx"}[6h])) / clamp_min(sum(rate(belegt_http_request_duration_seconds_count{method="POST",route=~"/graph/objects.*"}[6h])), 1e-9)
      - record: belegt:slo06_error_ratio:rate3d
        expr: sum(rate(belegt_http_request_duration_seconds_count{method="POST",route=~"/graph/objects.*",status_class="5xx"}[3d])) / clamp_min(sum(rate(belegt_http_request_duration_seconds_count{method="POST",route=~"/graph/objects.*"}[3d])), 1e-9)
      # SLO-04：llm-proxy 调用成功率（含切换备用模型）
      - record: belegt:slo04_success_ratio:rate1h
        expr: sum(rate(belegt_llm_request_duration_seconds_count{outcome=~"ok|fallback_ok"}[1h])) / clamp_min(sum(rate(belegt_llm_request_duration_seconds_count[1h])), 1e-9)
      # SLO-05：外发在 15 min 内投递成功
      - record: belegt:slo05_success_ratio:rate1h
        expr: sum(rate(belegt_egress_messages_total{result="delivered_15m"}[1h])) / clamp_min(sum(rate(belegt_egress_messages_total{result=~"delivered_15m|delivered_late|failed"}[1h])), 1e-9)
      # DSH-03 / ALR-05：LLM 成本
      - record: belegt:llm_cost_eur:increase1d
        expr: sum by (org_tier) (increase(belegt_llm_cost_eur_total[1d]))
      - record: belegt:request_cost_eur:p95_24h
        expr: histogram_quantile(0.95, sum by (le) (rate(belegt_request_llm_cost_eur_bucket[24h])))
      - record: belegt:first_draft_seconds:p95_1d
        expr: histogram_quantile(0.95, sum by (le, deploy_profile) (rate(belegt_request_first_draft_seconds_bucket[1d])))

  # ------------------------------------------------------------------ 告警
  - name: belegt-slo-alerts
    rules:
      - alert: BelegtSLOBurnFast            # ALR-01：14.4×（1 h + 5 min）—— 1 h 内耗掉 2% 月预算
        expr: |
          (belegt:slo01_error_ratio:rate1h > (14.4 * 0.001) and belegt:slo01_error_ratio:rate5m > (14.4 * 0.001))
          or
          (belegt:slo06_error_ratio:rate1h > (14.4 * 0.0005) and belegt:slo06_error_ratio:rate5m > (14.4 * 0.0005))
        for: 2m
        labels: { severity: page, alert_id: ALR-01 }
        annotations:
          summary: "SLO-01/06 燃烧率 ≥ 14.4×"
          runbook_url: "deploy/ops/alerts-runbook.md#alr-01--alr-03-slo-燃烧率"
      - alert: BelegtSLOBurnMedium          # ALR-02：6×（6 h + 30 min）
        expr: |
          (belegt:slo01_error_ratio:rate6h > (6 * 0.001) and belegt:slo01_error_ratio:rate30m > (6 * 0.001))
          or
          (belegt:slo06_error_ratio:rate6h > (6 * 0.0005) and belegt:slo06_error_ratio:rate30m > (6 * 0.0005))
        for: 15m
        labels: { severity: page, alert_id: ALR-02 }
        annotations:
          summary: "SLO-01/06 燃烧率 ≥ 6×"
          runbook_url: "deploy/ops/alerts-runbook.md#alr-01--alr-03-slo-燃烧率"
      - alert: BelegtSLOBurnSlow            # ALR-03：1×（3 d + 6 h）
        expr: |
          (belegt:slo01_error_ratio:rate3d > 0.001 and belegt:slo01_error_ratio:rate6h > 0.001)
          or
          (belegt:slo06_error_ratio:rate3d > 0.0005 and belegt:slo06_error_ratio:rate6h > 0.0005)
        for: 1h
        labels: { severity: ticket, alert_id: ALR-03 }
        annotations:
          summary: "SLO-01/06 燃烧率 ≥ 1×（错误预算按月耗尽）"
          runbook_url: "deploy/ops/alerts-runbook.md#alr-01--alr-03-slo-燃烧率"
      - alert: BelegtHaltedPolicy           # ALR-04a：任意 halted:policy → 呼叫
        expr: sum(increase(belegt_guard_decisions_total{result="halted_policy"}[5m])) > 0
        labels: { severity: page, alert_id: ALR-04 }
        annotations:
          summary: "guard 触发 halted:policy"
          runbook_url: "deploy/ops/alerts-runbook.md#alr-04-halted"
      - alert: BelegtHaltedBudgetRatio      # ALR-04b：halted:budget_* 日比例 > 5% → 工单
        expr: |
          sum(increase(belegt_guard_decisions_total{result=~"halted_budget_.*"}[1d]))
            / clamp_min(sum(increase(belegt_request_first_draft_seconds_count[1d])), 1) > 0.05
        for: 30m
        labels: { severity: ticket, alert_id: ALR-04 }
        annotations:
          summary: "halted:budget_* 日比例 > 5%"
          runbook_url: "deploy/ops/alerts-runbook.md#alr-04-halted"
      - alert: BelegtRequestCostP95High     # ALR-05a：单份成本 24 h P95 > €3（10 §4.4）
        expr: belegt:request_cost_eur:p95_24h > 3
        for: 30m
        labels: { severity: ticket, alert_id: ALR-05 }
        annotations:
          summary: "单份问卷 LLM 成本 24 h P95 = €{{ $value | printf \"%.2f\" }} > €3"
          runbook_url: "deploy/ops/alerts-runbook.md#alr-05-成本"
      - alert: BelegtTierSpendSpike         # ALR-05b：日 LLM 支出 > 7 日均值 3×（按 org_tier；按租户明细从 Trace 表查）
        expr: belegt:llm_cost_eur:increase1d > 3 * avg_over_time(belegt:llm_cost_eur:increase1d[7d])
        for: 1h
        labels: { severity: page, alert_id: ALR-05 }
        annotations:
          summary: "org_tier={{ $labels.org_tier }} 日 LLM 支出突增"
          runbook_url: "deploy/ops/alerts-runbook.md#alr-05-成本"
      - alert: BelegtAuditChainBroken       # ALR-06：审计链不连续（SLO-07）→ P1 安全事件
        expr: max(belegt_audit_chain_breaks) > 0 or (time() - max(belegt_audit_chain_last_verified_timestamp_seconds)) > 7200
        labels: { severity: security, alert_id: ALR-06 }
        annotations:
          summary: "审计哈希链校验失败或超过 2 h 未校验（SLO-07）"
          runbook_url: "deploy/ops/incident-response-runbook.md#审计链断裂alr-06"
      - alert: BelegtTemporalScheduleToStart   # ALR-07：schedule-to-start P95 > 30 s 持续 10 min（指标名以 Temporal 版本为准）
        expr: histogram_quantile(0.95, sum by (le, task_queue) (rate(task_schedule_to_start_latency_bucket[5m]))) > 30
        for: 10m
        labels: { severity: page, alert_id: ALR-07 }
        annotations:
          summary: "Temporal task queue {{ $labels.task_queue }} 排队 P95 > 30 s"
          runbook_url: "deploy/ops/alerts-runbook.md#alr-07-temporal-积压"
      - alert: BelegtPgReplicationOrWal     # ALR-08：PG 复制延迟 > 60 s 或 WAL 归档失败
        expr: max(pg_replication_lag_seconds) > 60 or increase(pg_stat_archiver_failed_count[15m]) > 0
        for: 5m
        labels: { severity: page, alert_id: ALR-08 }
        annotations:
          summary: "PostgreSQL 复制延迟或 WAL 归档失败"
          runbook_url: "deploy/ops/alerts-runbook.md#alr-08-postgresql-复制wal"
      - alert: BelegtBackupFailing          # ALR-09：备份连续 2 次失败（SLO-08）
        expr: max(belegt_backup_consecutive_failures) >= 2 or (time() - max(belegt_backup_last_success_timestamp_seconds)) > 2 * 86400
        labels: { severity: page, alert_id: ALR-09 }
        annotations:
          summary: "备份连续失败或最新可恢复点超出 RPO"
          runbook_url: "deploy/ops/alerts-runbook.md#alr-09-备份"
      - alert: BelegtHallucinationSuspect   # ALR-10：PC-04 失败率 > 2%
        expr: |
          sum(rate(belegt_promotion_total{rule="PC-04",result="fail"}[1d]))
            / clamp_min(sum(rate(belegt_promotion_total{rule="PC-04"}[1d])), 1e-9) > 0.02
        for: 1h
        labels: { severity: ticket, alert_id: ALR-10, team: agent }
        annotations:
          summary: "PC-04 失败率 > 2%（疑似幻觉）"
          runbook_url: "deploy/ops/alerts-runbook.md#alr-10-agent-质量"
      - alert: BelegtEgressBlockSpike       # ALR-11：egress.block 或 GP-07 拒绝突增（> 基线 5×）
        expr: |
          (sum(rate(belegt_egress_messages_total{result="blocked"}[1h])) > 5 * sum(rate(belegt_egress_messages_total{result="blocked"}[7d])) and sum(increase(belegt_egress_messages_total{result="blocked"}[1h])) > 5)
          or
          (sum(rate(belegt_guard_decisions_total{check="GP-07",result="deny"}[1h])) > 5 * sum(rate(belegt_guard_decisions_total{check="GP-07",result="deny"}[7d])) and sum(increase(belegt_guard_decisions_total{check="GP-07",result="deny"}[1h])) > 5)
        for: 10m
        labels: { severity: security, alert_id: ALR-11 }
        annotations:
          summary: "egress.block / GP-07 拒绝突增"
          runbook_url: "deploy/ops/incident-response-runbook.md#出口阻断或注入突增alr-11"
      - alert: BelegtSecretExpiringSoon     # ALR-12：证书、令牌、密钥 14 天内到期
        expr: (min by (name) (belegt_secret_expiry_timestamp_seconds) - time()) < 14 * 86400 or (min by (instance) (probe_ssl_earliest_cert_expiry) - time()) < 14 * 86400
        labels: { severity: ticket, alert_id: ALR-12 }
        annotations:
          summary: "{{ $labels.name }}{{ $labels.instance }} 将在 14 天内到期"
          runbook_url: "deploy/ops/key-rotation-runbook.md"
