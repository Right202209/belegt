{{- /* Spec: 03 §6.8（Graph API）、10 §3.4（API P95）、§5.1；07 §2.2；deploy/docker/entry/belegt_asgi.py */ -}}
{{- $ns := include "belegt.ns" (list . "app") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "belegt.fullname" . }}-api
  namespace: {{ $ns }}
  labels:
    {{- include "belegt.labels" . | nindent 4 }}
    {{- include "belegt.selector" (list . "api" "app") | nindent 4 }}
spec:
  {{- if not .Values.api.hpa.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      {{- include "belegt.selector" (list . "api" "app") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "belegt.labels" . | nindent 8 }}
        {{- include "belegt.selector" (list . "api" "app") | nindent 8 }}
        belegt.io/egress-client: "true"
        {{- with .Values.global.podLabels }}{{ toYaml . | nindent 8 }}{{ end }}
      annotations:
        {{- with .Values.global.podAnnotations }}{{ toYaml . | nindent 8 }}{{ end }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "belegt.podSecurityContext" . | nindent 8 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- include "belegt.scheduling" (list . "app") | nindent 6 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "belegt.selector" (list . "api" "app") | nindent 14 }}
      containers:
        - name: api
          image: {{ include "belegt.image" (list . .Values.image.api) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--workers", {{ .Values.api.workers | quote }}]
          ports:
            - { name: http, containerPort: 8000, protocol: TCP }
          env:
            {{- include "belegt.commonEnv" . | nindent 12 }}
            {{- include "belegt.trustedEnv" . | nindent 12 }}
            {{- include "belegt.proxyEnv" . | nindent 12 }}
            - name: OTEL_SERVICE_NAME
              value: graph-api
            {{- if .Values.api.devTokens }}
            - name: BELEGT_DEV_TOKENS
              value: /run/belegt/dev-tokens.json
            {{- end }}
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            failureThreshold: 30
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- include "belegt.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            {{- if .Values.api.devTokens }}
            - { name: dev-tokens, mountPath: /run/belegt, readOnly: true }
            {{- end }}
      volumes:
        {{- include "belegt.tmpVolume" . | nindent 8 }}
        {{- if .Values.api.devTokens }}
        - name: dev-tokens
          secret:
            secretName: {{ include "belegt.secretName" . }}
            items: [{ key: dev-tokens.json, path: dev-tokens.json }]
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "belegt.fullname" . }}-api
  namespace: {{ $ns }}
  labels:
    {{- include "belegt.labels" . | nindent 4 }}
    {{- include "belegt.selector" (list . "api" "app") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "belegt.selector" (list . "api" "app") | nindent 4 }}
  ports:
    - { name: http, port: {{ .Values.api.service.port }}, targetPort: http, protocol: TCP }
