{{- /* Spec: 10 §6.2（Ingress + WAF 在 belegt-edge）；08 §7.1（反向代理不得记录 /r/* 等魔法链接路径） */ -}}
{{- if .Values.ingress.enabled }}
{{- $ns := include "belegt.ns" (list . "app") }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "belegt.fullname" . }}
  namespace: {{ $ns }}
  labels:
    {{- include "belegt.metaLabels" . | nindent 4 }}
  annotations:
    {{- with .Values.ingress.annotations }}{{ toYaml . | nindent 4 }}{{ end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  tls:
    - hosts: [{{ .Values.ingress.web.host | quote }}]
      secretName: {{ .Values.ingress.web.tlsSecret }}
    {{- if .Values.supplier.enabled }}
    - hosts: [{{ .Values.ingress.supplier.host | quote }}]
      secretName: {{ .Values.ingress.supplier.tlsSecret }}
    {{- end }}
  rules:
    - host: {{ .Values.ingress.web.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "belegt.fullname" . }}-web
                port: { name: http }
    {{- if .Values.supplier.enabled }}
    - host: {{ .Values.ingress.supplier.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "belegt.fullname" . }}-supplier
                port: { name: http }
    {{- end }}
{{- end }}
