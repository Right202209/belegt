{{- /*
Spec: 07 §4.5（密钥管理）、§2.2（隔离区只挂 LLM 代理短期令牌与只读凭据）、10 §8.5（轮换）
secrets.create=true 仅用于开发/测试。生产：secrets.create=false，由 Vault Agent / External Secrets Operator 同步：
  <existingSecret>（命名空间 = app 与 trusted 分区）键：
    postgres-admin-password   迁移 Job 管理员密码
    app-db-password           BELEGT_DB_APP_USER 密码（Vault database engine 动态凭据时由同步器轮换）
    auditor-db-password       审计只读账号密码
    quarantine-db-password    迁移 Job 创建隔离区账号用
    s3-access-key-id / s3-secret-access-key
    llm-api-key               仅 worker 读取（07：仅 llm-proxy 可读）
    supplier-secret / supplier-manifest-secret / supplier-webhook-secret / supplier-admin-key
    dev-tokens.json           仅开发
  <existingQuarantineSecret>（命名空间 = quarantine 分区）键：quarantine-db-password、llm-api-key
密码请用 URL 安全字符（openssl rand -hex 32）：它们会被拼进 BELEGT_DB_URL。
*/ -}}
{{- if .Values.secrets.create }}
{{- $s := .Values.secrets.values }}
{{- $hook := dict "helm.sh/hook" "pre-install,pre-upgrade" "helm.sh/hook-weight" "-20" "helm.sh/hook-delete-policy" "before-hook-creation" }}
{{- range $zone := list "app" "trusted" }}
{{- $ns := include "belegt.ns" (list $ $zone) }}
{{- if or (eq $zone "app") (ne $ns (include "belegt.ns" (list $ "app"))) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "belegt.secretName" $ }}
  namespace: {{ $ns }}
  labels:
    {{- include "belegt.metaLabels" $ | nindent 4 }}
  annotations:
    {{- toYaml $hook | nindent 4 }}
type: Opaque
stringData:
  postgres-admin-password: {{ required "secrets.values.postgresAdminPassword" $s.postgresAdminPassword | quote }}
  app-db-password: {{ required "secrets.values.appDbPassword" $s.appDbPassword | quote }}
  quarantine-db-password: {{ required "secrets.values.quarantineDbPassword" $s.quarantineDbPassword | quote }}
  auditor-db-password: {{ required "secrets.values.auditorDbPassword" $s.auditorDbPassword | quote }}
  s3-access-key-id: {{ $s.s3AccessKeyId | quote }}
  s3-secret-access-key: {{ $s.s3SecretAccessKey | quote }}
  llm-api-key: {{ $s.llmApiKey | quote }}
  supplier-secret: {{ required "secrets.values.supplierSecret" $s.supplierSecret | quote }}
  supplier-manifest-secret: {{ required "secrets.values.supplierManifestSecret" $s.supplierManifestSecret | quote }}
  supplier-webhook-secret: {{ required "secrets.values.supplierWebhookSecret" $s.supplierWebhookSecret | quote }}
  supplier-admin-key: {{ $s.supplierAdminKey | quote }}
  dev-tokens.json: {{ default "{}" $s.devTokensJson | quote }}
{{- end }}
{{- end }}
{{- if .Values.workerQuarantine.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "belegt.quarantineSecretName" . }}
  namespace: {{ include "belegt.ns" (list . "quarantine") }}
  labels:
    {{- include "belegt.metaLabels" . | nindent 4 }}
type: Opaque
stringData:
  quarantine-db-password: {{ required "secrets.values.quarantineDbPassword" $s.quarantineDbPassword | quote }}
  llm-api-key: {{ $s.quarantineLlmApiKey | quote }}
{{- end }}
{{- end }}
