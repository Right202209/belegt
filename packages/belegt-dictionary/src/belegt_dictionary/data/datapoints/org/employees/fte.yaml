id: dp:org.employees.fte
version: 1.0.0
introduced_in: v2027.1
status: draft
label:
  de: Beschäftigte (Vollzeitäquivalente)
  en: Employees, full-time equivalents
  zh: 全职当量人数
definition:
  en: Average number of employees over the reporting period expressed in full-time equivalents, where one FTE is the contractual working time of a full-time position. Excludes agency workers. For the period-end headcount see dp:org.employees.headcount.
  de: Durchschnittliche Zahl der Beschäftigten im Berichtszeitraum in Vollzeitäquivalenten. Leiharbeitnehmer sind ausgeschlossen. Kopfzahl siehe dp:org.employees.headcount.
  zh: 报告期内员工平均人数，以全职当量计（1 FTE = 一个全职岗位的合同工时）；不含劳务派遣。期末人头数见 dp:org.employees.headcount。
value_type: number
unit: '1'
period_type: reporting_period
boundary:
  - organization
  - site
consolidation:
  - operational_control
  - financial_control
  - equity_share
methodology_refs:
  - ref: eu_2026_1560_vcs
    clause: B1
sensitivity: customer_shared
evidence_requirements:
  accepted_source_types:
    - document
    - erp
    - human_confirmation
    - historical_answer
  min_sources: 1
  max_age_days: 400
  requires_calculation: false
  human_confirmation_allowed: true
validity_rule:
  min: 0
  expires_by: period_end_plus_days
  expires_after_days: 550
related_datapoints:
  - id: dp:org.employees.headcount
    relation: see_also
tags:
  - vsme
  - workforce
  - human_confirmable_number
