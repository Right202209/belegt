definition:
  en: Main economic activity of the undertaking classified with the statistical classification NACE, at section or division level. Where several activities exist, give the one with the largest share of turnover.
  de: Haupttätigkeit des Unternehmens nach der statistischen Systematik NACE (Abschnitt oder Abteilung). Bei mehreren Tätigkeiten die mit dem größten Umsatzanteil.
  zh: 按 NACE 统计分类（门类或大类）标注的企业主要经济活动；有多项活动时取营业额占比最大者。
