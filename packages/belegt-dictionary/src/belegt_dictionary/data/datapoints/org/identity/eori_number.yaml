id: dp:org.identity.eori_number
version: 1.0.0
introduced_in: v2027.1
status: draft
label:
  de: EORI-Nummer
  en: EORI number
  zh: EORI 号
definition:
  en: Economic Operators Registration and Identification number used by EU customs, starting with the two-letter code of the issuing member state. Excludes national registration and VAT numbers.
  de: Von der EU-Zollverwaltung vergebene EORI-Nummer, beginnend mit dem Ländercode des ausstellenden Mitgliedstaats. Nationale Register- und USt-Nummern sind ausgeschlossen.
  zh: 欧盟海关使用的经营者注册与识别号，以签发成员国两位字母代码开头；不含国家登记号与增值税号。
value_type: text
period_type: point_in_time
boundary:
  - organization
consolidation:
  - operational_control
  - financial_control
  - equity_share
methodology_refs:
  - ref: eu_2023_956_cbam
    clause: Art. 5
sensitivity: customer_shared
evidence_requirements:
  accepted_source_types:
    - document
    - public_source
    - human_confirmation
    - historical_answer
  min_sources: 1
  max_age_days: 730
  requires_calculation: false
  human_confirmation_allowed: true
validity_rule:
  regex: ^[A-Z]{2}[A-Za-z0-9]{1,15}$
  expires_by: evidence_valid_until
related_datapoints:
  - id: dp:org.identity.registration_number
    relation: see_also
tags:
  - cbam_communication
  - eudr_dds
  - identity
  - customs
