id: dp:org.identity.registration_number
version: 1.0.0
introduced_in: v2027.1
status: draft
label:
  de: Handelsregisternummer
  en: Business registration number
  zh: 商业登记号
definition:
  en: Identifier assigned to the undertaking by the national business or company register (e.g. HRB number with register court). Excludes tax IDs, VAT numbers and the EORI number (see dp:org.identity.eori_number).
  de: Vom nationalen Handels- oder Unternehmensregister vergebene Kennung (z. B. HRB-Nummer mit Registergericht). Steuer-, USt- und EORI-Nummern sind ausgeschlossen.
  zh: 国家商业/公司登记机关分配的企业登记号（如 HRB 号及登记法院）；不含税号、增值税号和 EORI 号（见 dp:org.identity.eori_number）。
value_type: text
period_type: point_in_time
boundary:
  - organization
consolidation:
  - operational_control
  - financial_control
  - equity_share
sensitivity: public
evidence_requirements:
