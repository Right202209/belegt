id: dp:mat.scip.scip_number
version: 1.0.0
introduced_in: v2027.1
status: draft
label:
  de: SCIP-Nummer
  en: SCIP number
  zh: SCIP 编号
definition:
  en: Identifier (UUID) returned by ECHA after successful notification of the article to the SCIP database under the Waste Framework Directive. Excludes submission numbers of rejected dossiers.
  de: Kennung (UUID), die ECHA nach erfolgreicher Meldung des Erzeugnisses an die SCIP-Datenbank gemäß Abfallrahmenrichtlinie vergibt.
  zh: 物品依《废物框架指令》成功通报 ECHA SCIP 数据库后返回的标识（UUID）；不含被拒卷宗的提交号。
value_type: text
period_type: point_in_time
boundary:
  - product
methodology_refs:
  - ref: eu_2008_98_wfd
    clause: Art. 9(1)(i)
sensitivity: public
evidence_requirements:
  accepted_source_types:
    - document
    - public_source
    - supplier_response
    - historical_answer
  min_sources: 1
  requires_calculation: false
  human_confirmation_allowed: false
validity_rule:
  regex: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
tags:
  - reach_scip
  - scip
