id: dp:gov.anticorruption.convictions_count
version: 1.0.0
introduced_in: v2027.1
status: draft
label:
  de: Verurteilungen wegen Korruption
  en: Convictions for corruption or bribery
  zh: 腐败定罪次数
definition:
  en: Number of final convictions of the undertaking for violation of anti-corruption and anti-bribery laws during the reporting period. Excludes ongoing proceedings and convictions of individuals not attributable to the undertaking.
  de: Anzahl rechtskräftiger Verurteilungen des Unternehmens wegen Verstößen gegen Antikorruptionsgesetze im Berichtszeitraum. Laufende Verfahren zählen nicht.
  zh: 报告期内企业因违反反腐败、反贿赂法律被终审定罪的次数；不含进行中程序及不可归属企业的个人定罪。
value_type: number
unit: '1'
period_type: reporting_period
boundary:
  - organization
consolidation:
  - operational_control
  - financial_control
  - equity_share
methodology_refs:
  - ref: eu_2026_1560_vcs
    clause: B11
sensitivity: customer_shared
evidence_requirements:
  accepted_source_types:
    - document
    - erp
    - human_confirmation
    - historical_answer
  min_sources: 1
  max_age_days: 400
  requires_calculation: false
  human_confirmation_allowed: true
validity_rule:
  min: 0
  regex: ^[0-9]+$
  expires_by: period_end_plus_days
  expires_after_days: 550
related_datapoints:
  - id: dp:gov.anticorruption.fines_amount
    relation: see_also
tags:
  - vsme
  - anticorruption
  - human_confirmable_number
