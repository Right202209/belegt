id: dp:prod.cbam.specific_electricity_consumption
version: 1.0.0
introduced_in: v2027.1
status: draft
label:
  de: Spezifischer Stromverbrauch (CBAM)
  en: Specific electricity consumption (CBAM)
  zh: 比电耗
definition:
  en: Electricity consumed per tonne of CBAM good produced at the installation in the reporting period, including electricity attributed via precursors, used as input for indirect embedded emissions.
  de: Je Tonne CBAM-Ware in der Anlage verbrauchter Strom im Berichtszeitraum einschließlich über Vorprodukte zugeordneten Stroms; Eingangsgröße für indirekte graue Emissionen.
  zh: 报告期内装置每生产一吨 CBAM 货物消耗的电量（含通过前体归属的电量），作为间接隐含排放的输入。
value_type: number
unit: MWh/t
period_type: calendar_year
boundary:
  - product_per_unit
methodology_refs:
  - ref: eu_2023_1773_cbam_ir
    clause: Annex III
sensitivity: confidential
evidence_requirements:
  accepted_source_types:
    - document
    - supplier_response
    - historical_answer
  min_sources: 1
  max_age_days: 550
  requires_calculation: true
  human_confirmation_allowed: false
validity_rule:
  min: 0
  expires_by: period_end_plus_days
  expires_after_days: 550
related_datapoints:
  - id: dp:prod.cbam.see_indirect
    relation: see_also
  - id: dp:energy.consumption.electricity_total
    relation: derived_from
tags:
  - cbam_communication
  - cbam
