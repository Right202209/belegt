id: dp:prod.cbam.see_direct
version: 1.0.0
introduced_in: v2027.1
status: draft
label:
  de: Spezifische direkte graue Emissionen
  en: Specific embedded emissions, direct
  zh: 直接比隐含排放
definition:
  en: Direct embedded emissions of the CBAM good per tonne of good produced at the installation, including attributed direct emissions of relevant precursors, determined per the CBAM monitoring methodology. Excludes indirect emissions from electricity (dp:prod.cbam.see_indirect).
  de: Direkte graue Emissionen der CBAM-Ware je Tonne einschließlich zugeordneter direkter Emissionen relevanter Vorprodukte, nach CBAM-Überwachungsmethodik. Indirekte Emissionen siehe dp:prod.cbam.see_indirect.
  zh: 按 CBAM 监测方法学确定的每吨 CBAM 货物直接隐含排放，含相关前体的归属直接排放；不含电力间接排放（dp:prod.cbam.see_indirect）。
value_type: number
unit: tCO2e/t
allowed_units:
  - tCO2e/t
  - kgCO2e/kg
period_type: calendar_year
boundary:
  - product_per_unit
methodology_refs:
  - ref: eu_2023_956_cbam
    clause: Annex IV
  - ref: eu_2023_1773_cbam_ir
    clause: Annex III
sensitivity: customer_shared
evidence_requirements:
  accepted_source_types:
    - document
    - supplier_response
    - historical_answer
  min_sources: 1
  max_age_days: 550
  requires_calculation: true
  human_confirmation_allowed: false
validity_rule:
  min: 0
  expires_by: period_end_plus_days
  expires_after_days: 550
related_datapoints:
  - id: dp:prod.cbam.see_indirect
    relation: see_also
tags:
  - cbam_communication
  - cbam
