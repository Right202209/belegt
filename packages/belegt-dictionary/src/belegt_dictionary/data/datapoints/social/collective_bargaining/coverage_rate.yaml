id: dp:social.collective_bargaining.coverage_rate
version: 1.0.0
introduced_in: v2027.1
status: draft
label:
  de: Tarifbindungsquote
  en: Collective bargaining coverage rate
  zh: 集体协议覆盖率
definition:
  en: Share of employees whose working conditions are covered by collective bargaining agreements at the end of the reporting period, as percentage of dp:org.employees.headcount.
  de: Anteil der Beschäftigten, deren Arbeitsbedingungen am Ende des Berichtszeitraums durch Tarifverträge geregelt sind, in Prozent von dp:org.employees.headcount.
  zh: 报告期末工作条件受集体协议覆盖的员工占 dp:org.employees.headcount 的百分比。
value_type: number
unit: '%'
period_type: point_in_time
boundary:
  - organization
consolidation:
  - operational_control
  - financial_control
  - equity_share
methodology_refs:
  - ref: eu_2026_1560_vcs
    clause: B10
sensitivity: customer_shared
evidence_requirements:
  accepted_source_types:
    - document
    - erp
    - human_confirmation
    - historical_answer
  min_sources: 1
  max_age_days: 400
  requires_calculation: false
  human_confirmation_allowed: true
validity_rule:
  min: 0
  max: 100
  expires_by: period_end_plus_days
  expires_after_days: 400
related_datapoints:
  - id: dp:org.employees.headcount
    relation: derived_from
tags:
  - vsme
  - workforce
  - human_confirmable_number
