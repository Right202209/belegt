id: dp:social.workforce.temporary_count
version: 1.0.0
introduced_in: v2027.1
status: draft
label:
  de: Befristet Beschäftigte
  en: Employees on temporary contracts
  zh: 临时合同员工人数
definition:
  en: Number of employees with a fixed-term contract at the end of the reporting period, in persons. Excludes agency workers and contractors. Subset of dp:org.employees.headcount.
  de: Anzahl der Beschäftigten mit befristetem Vertrag am Ende des Berichtszeitraums in Köpfen. Leiharbeitnehmer ausgeschlossen. Teilmenge von dp:org.employees.headcount.
  zh: 报告期末持固定期限合同的员工人数（人头），不含劳务派遣与外包；是 dp:org.employees.headcount 的子集。
value_type: number
unit: '1'
period_type: point_in_time
boundary:
  - organization
consolidation:
  - operational_control
  - financial_control
  - equity_share
methodology_refs:
  - ref: eu_2026_1560_vcs
    clause: B8
sensitivity: customer_shared
evidence_requirements:
  accepted_source_types:
    - document
    - erp
    - human_confirmation
    - historical_answer
  min_sources: 1
  max_age_days: 400
  requires_calculation: false
  human_confirmation_allowed: true
validity_rule:
  min: 0
  regex: ^[0-9]+$
  expires_by: period_end_plus_days
  expires_after_days: 400
  plausibility:
    - expr: value <= dp:org.employees.headcount
      severity: warn
      note: 临时合同人数不应超过总人数
related_datapoints:
  - id: dp:org.employees.headcount
    relation: component_of
tags:
  - vsme
  - workforce
  - human_confirmable_number
