id: dp:social.workforce.headcount.female
version: 1.0.0
introduced_in: v2027.1
status: draft
label:
  de: Beschäftigte weiblich (Köpfe)
  en: Employees, female (headcount)
  zh: 女性员工人数
definition:
  en: Number of employees reported as female at the end of the reporting period, in persons. Aggregate value only; no personal data is processed. Slice of dp:org.employees.headcount by gender.
  de: Anzahl der als weiblich gemeldeten Beschäftigten am Ende des Berichtszeitraums in Köpfen; nur aggregierter Wert. Aufschlüsselung von dp:org.employees.headcount nach Geschlecht.
  zh: 报告期末登记为女性的员工人数（人头），仅汇总值、不处理个人数据；是 dp:org.employees.headcount 按性别的切片。
value_type: number
unit: '1'
period_type: point_in_time
boundary:
  - organization
consolidation:
  - operational_control
  - financial_control
  - equity_share
methodology_refs:
  - ref: eu_2026_1560_vcs
    clause: B8
sensitivity: customer_shared
evidence_requirements:
  accepted_source_types:
    - document
    - erp
    - human_confirmation
    - historical_answer
  min_sources: 1
  max_age_days: 400
  requires_calculation: false
  human_confirmation_allowed: true
validity_rule:
  min: 0
  regex: ^[0-9]+$
  expires_by: period_end_plus_days
  expires_after_days: 400
related_datapoints:
  - id: dp:org.employees.headcount
    relation: component_of
tags:
  - vsme
  - workforce
  - human_confirmable_number
