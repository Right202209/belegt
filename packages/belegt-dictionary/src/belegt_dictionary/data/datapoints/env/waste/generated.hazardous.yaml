id: dp:env.waste.generated.hazardous
version: 1.0.0
introduced_in: v2027.1
status: draft
label:
  de: Gefährliche Abfälle
  en: Hazardous waste generated
  zh: 危险废弃物
definition:
  en: Mass of waste classified as hazardous under applicable waste legislation and generated within the reporting boundary during the reporting period. This is a component of total waste generated; it is not the amount sent only to hazardous-waste disposal.
  de: Masse der nach geltendem Abfallrecht als gefährlich eingestuften und im Berichtszeitraum entstandenen Abfälle. Teil des gesamten Abfallaufkommens, unabhängig vom Entsorgungsweg.
  zh: 报告边界内报告期产生、按适用废弃物法规分类为危险的废弃物质量；属于总废弃物分项，不限于送往危险废弃物处置的数量。
value_type: number
unit: t
allowed_units:
  - t
  - kg
period_type: reporting_period
boundary:
  - organization
  - site
consolidation:
  - operational_control
  - financial_control
  - equity_share
methodology_refs:
  - ref: eu_2026_1560_vcs
    clause: B7 Para 39(a)
  - ref: eu_2008_98_wfd
sensitivity: customer_shared
evidence_requirements:
  accepted_source_types:
    - document
    - erp
    - historical_answer
  min_sources: 1
  max_age_days: 550
  requires_calculation: false
  human_confirmation_allowed: false
validity_rule:
  min: 0
  expires_by: period_end_plus_days
  expires_after_days: 550
related_datapoints:
  - id: dp:env.waste.generated
    relation: component_of
tags:
  - vsme
  - waste
