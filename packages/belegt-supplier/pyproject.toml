[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "belegt-supplier"
version = "0.1.0"
description = "Belegt 供应商端：多语言消息模板、催办策略、合理性校验、魔法链接门户与 supplier-api（Spec: 08）"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "sqlalchemy>=2.0",
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "python-ulid>=2.0",
  "python-multipart>=0.0.9",
  "uvicorn>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]
holidays = ["holidays>=0.50"]

[project.scripts]
belegt-supplier = "belegt_supplier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
belegt_supplier = ["data/*.yaml", "data/templates/*/*.yaml", "data/locales/*.yaml", "web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
