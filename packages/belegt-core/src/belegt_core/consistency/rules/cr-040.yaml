# Spec: 06 §2.2 CR-040
rule_id: CR-040
rule_version: 1.0.0
category: estimate
severity: info
title:
  de: Hoher Schätzanteil
  en: High share of estimates
scope: request
triggers:
- pre_submit_gate
- daily_batch
plugin: cr_040
when: numbers > 0
assert: dec(estimates) / dec(numbers) <= dec(max_share)
tolerance:
  rel: '0.30'
default_action: hint
explain_template: cr-040
tests: tests/test_consistency_rules.py::test_cr_040
