# Spec: 06 §2.2 CR-009
rule_id: CR-009
rule_version: 1.0.0
category: cross_customer
severity: warn
title:
  de: Abgrenzung gegenüber Vorjahresmeldung geändert
  en: Reporting basis changed vs. last submission
scope: org
triggers:
- answer_write
- pre_submit_gate
- daily_batch
- context_change
plugin: cr_009
assert: last.boundary == cur.boundary && last.consolidation == cur.consolidation && last.method == cur.method
default_action: open_conflict
explain_template: cr-009
tests: tests/test_consistency_rules.py::test_cr_009
