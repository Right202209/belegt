# Spec: 06 §2.2 CR-011
rule_id: CR-011
rule_version: 1.0.0
category: unit
severity: block
title:
  de: Größenordnung auffällig (Einheitenverwechslung?)
  en: Order-of-magnitude anomaly (unit mix-up?)
scope: org
triggers:
- answer_write
- pre_submit_gate
- daily_batch
- context_change
plugin: cr_011
assert: '!((dec(r) >= dec(''500'') && dec(r) <= dec(''2000'')) || (dec(r) >= dec(''0.0005'') && dec(r) <= dec(''0.002'')) || (dec(r) >= dec(''500000'') && dec(r) <= dec(''2000000'')))'
tolerance:
  ratio_bands:
  - 500..2000
  - 1/2000..1/500
  - 5e5..2e6
default_action: open_conflict
explain_template: cr-011
tests: tests/test_consistency_rules.py::test_cr_011
