# Spec: 06 §2.2 CR-028
rule_id: CR-028
rule_version: 1.0.0
category: calculation
severity: warn
title:
  de: Implizite Stromintensität außerhalb des Bereichs
  en: Implied grid intensity out of range
scope: org
triggers:
- answer_write
- pre_submit_gate
- daily_batch
- context_change
plugin: cr_028
assert: dec(ratio) >= dec('0') && dec(ratio) <= dec('1.2')
tolerance:
  range: 0..1.2 tCO2e/MWh
default_action: open_conflict
explain_template: cr-028
tests: tests/test_consistency_rules.py::test_cr_028
