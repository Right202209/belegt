# Spec: 06 §2.2 CR-002
rule_id: CR-002
rule_version: 1.0.0
category: cross_period
severity: warn
title:
  de: Veränderung zur Vorperiode über Schwelle
  en: Period-over-period change above threshold
scope: org
triggers:
- answer_write
- pre_submit_gate
- daily_batch
- context_change
plugin: cr_002
when: dec(prev.value) != dec('0')
assert: dec_abs(dec(cur.value) / dec(prev.value) - dec('1')) <= dec(theta)
tolerance:
  rel: '0.30'
default_action: open_conflict
explain_template: cr-002
tests: tests/test_consistency_rules.py::test_cr_002
