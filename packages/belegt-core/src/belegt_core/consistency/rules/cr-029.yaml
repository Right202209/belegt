# Spec: 06 §2.2 CR-029
rule_id: CR-029
rule_version: 1.0.0
category: calculation
severity: block
title:
  de: Herkunftsnachweise/Eigenerzeugung vs. Stromverbrauch
  en: EACs/on-site vs. electricity
scope: org
triggers:
- answer_write
- pre_submit_gate
- daily_batch
- context_change
plugin: cr_029
assert: 'check == ''supply'' ? dec(eac) + dec(onsite) <= dec(elec) + dec(''1'') : dec(share) * dec(total) / dec(''100'') >= dec(eac) + dec(onsite) - dec(''1'')'
severity_expr: 'check == ''supply'' ? ''block'' : ''warn'''
tolerance:
  abs: '1'
  unit: MWh
default_action: open_conflict
explain_template: cr-029
tests: tests/test_consistency_rules.py::test_cr_029
