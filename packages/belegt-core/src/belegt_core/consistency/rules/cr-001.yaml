# Spec: 06 §2.2 CR-001
rule_id: CR-001
rule_version: 1.0.0
category: cross_customer
severity: block
title:
  de: Kundenübergreifend abweichender Wert
  en: Cross-customer value mismatch
scope: org
triggers:
- answer_write
- pre_submit_gate
- daily_batch
- context_change
plugin: cr_001
assert: dec(a.value) == dec(b.value) || divergence_recorded
tolerance:
  abs: '0'
  rel: '0'
default_action: open_conflict
explain_template: cr-001
tests: tests/test_consistency_rules.py::test_cr_001
