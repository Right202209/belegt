# Spec: 06 §2.2 CR-012
rule_id: CR-012
rule_version: 1.0.0
category: validity
severity: warn
title:
  de: Nachweis älter als zulässig
  en: Evidence older than max_age_days
scope: answer
triggers:
- answer_write
- pre_submit_gate
- daily_batch
plugin: cr_012
assert: age_days <= max_age_days
tolerance:
  days: 0
default_action: open_conflict
explain_template: cr-012
tests: tests/test_consistency_rules.py::test_cr_012
