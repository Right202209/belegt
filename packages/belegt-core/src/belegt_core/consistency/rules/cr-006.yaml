# Spec: 06 §2.2 CR-006
rule_id: CR-006
rule_version: 1.0.0
category: reference_integrity
severity: block
title:
  de: Zwei Quellen mit unterschiedlichem Wert
  en: Two sources disagree
scope: org
triggers:
- answer_write
- pre_submit_gate
- daily_batch
- context_change
plugin: cr_006
assert: dec_eq(dec(v1), dec(v2), dec('0'), dec('0.005'))
tolerance:
  rel: '0.005'
default_action: open_conflict
explain_template: cr-006
tests: tests/test_consistency_rules.py::test_cr_006
