# Spec: 06 §2.2 CR-010
rule_id: CR-010
rule_version: 1.0.0
category: cross_period
severity: warn
title:
  de: Trendbruch gegenüber Historie
  en: Trend break vs. history
scope: org
triggers:
- answer_write
- pre_submit_gate
- daily_batch
- context_change
plugin: cr_010
when: dec(median) != dec('0')
assert: '!(dec_abs(dec(x) - dec(median)) > dec(''3'') * dec(''1.4826'') * dec(mad) && dec_abs(dec(x) / dec(median) - dec(''1'')) > dec(''0.15''))'
tolerance:
  mad_k: '3'
  rel: '0.15'
default_action: open_conflict
explain_template: cr-010
tests: tests/test_consistency_rules.py::test_cr_010
