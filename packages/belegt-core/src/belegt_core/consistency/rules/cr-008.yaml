# Spec: 06 §2.2 CR-008
rule_id: CR-008
rule_version: 1.0.0
category: cross_customer
severity: block
title:
  de: Mehrere Werte für denselben Antwortschlüssel
  en: Multiple values for one answer key
scope: request
triggers:
- answer_write
- pre_submit_gate
- daily_batch
plugin: cr_008
assert: distinct_values <= 1
default_action: open_conflict
explain_template: cr-008
tests: tests/test_consistency_rules.py::test_cr_008
