[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "belegt-connectors"
version = "0.1.0"
description = "Belegt 只读 MCP 连接器：规范 belegt-connector/1、合规测试套件，以及 CSV/Excel 文件夹、通用 SQL、模拟 ERP（SAP B1 / DATEV）、IMAP 邮箱、电费/燃气单 PDF 连接器（Spec: 04 §6.1，FR-005/FR-101/FR-203）"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [{ name = "Belegt contributors" }]
dependencies = [
  "pydantic>=2.5",
  "jsonschema>=4.20",
  "sqlalchemy>=2.0",
  "openpyxl>=3.1",
]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
# MCP server 形态（stdio / streamable-http）；mcp 1.x（FastMCP）与 2.x（MCPServer）均兼容
mcp = ["mcp>=1.2"]
# 电费/燃气单 PDF：优先用 belegt-io 的证据提取（页码 + bbox），缺失时退回 pypdf 文本层
pdf = ["pypdf>=4.0"]
io = ["belegt-io>=0.1.0"]
test = ["pytest>=8"]

[project.scripts]
belegt-connector = "belegt_connectors.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
belegt_connectors = ["data/erp_sample/*.json", "data/erp_sample/*/*.json", "data/erp_sample/*/*.csv",
                     "data/samples/*", "data/samples/*/*", "data/samples/*/*/*", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
