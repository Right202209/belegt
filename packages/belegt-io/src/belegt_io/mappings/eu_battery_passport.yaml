# Spec: 02 §4.3.8（字段名参考 Battery Pass / DIN DKE SPEC 99100 [需核对]）；01 AC-503-2
template_mapping: tm:eu_battery_passport@2023-1542
template_id: eu_battery_passport
template_version: "2023-1542"
template_source: "Reg. (EU) 2023/1542 Art. 7, Art. 77, Annex XIII"
fingerprint:
  threshold: 0.85
  markers:
    - { json_key: "batteryCarbonFootprint", weight: 3 }
    - { json_key: "batteryChemistry", weight: 1 }
entries:
