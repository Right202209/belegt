[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "belegt-bench"
version = "0.1.0"
description = "Belegt 公共评测基准：黄金集（bench-v2027.1）、标注 schema、κ、bench-synth、指标、bench-runner 与 CI 门禁 QG-01…QG-07（Spec: 11）"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0 (code) AND CC-BY-4.0 (data)" }
authors = [{ name = "Belegt contributors" }]
# 依赖方向（CONTRACTS）：bench 依赖全部包。dictionary（合成与基线）、connectors（PDF 生成器）为必需；
# io（证据基线）与 core（真实 Agent / guard）缺失时对应运行被跳过并提示。
dependencies = [
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "belegt-dictionary>=0.1.0",
  "belegt-connectors>=0.1.0",
]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
io = ["belegt-io>=0.1.0"]
core = ["belegt-core>=0.1.0"]
all = ["belegt-io>=0.1.0", "belegt-core>=0.1.0", "belegt-calc>=0.1.0"]
test = ["pytest>=8"]

[project.scripts]
belegt-bench = "belegt_bench.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
belegt_bench = ["config/*.yaml", "py.typed", "data/*/*.json", "data/*/*.txt", "data/*/*/*.jsonl",
                "data/*/*/*.json", "data/*/evidence/docs/*.pdf", "baselines/*/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
